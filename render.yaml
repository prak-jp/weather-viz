databases:
  - name: weather-viz-db
    databaseName: weather_viz
    user: weather_user
    plan: free

services:
  # 1. FastAPI Backend (Docker)
  - type: web
    name: weather-viz-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weather-viz-db
          property: connectionString
      - key: PORT
        value: 8000

  # 2. React Frontend (Static Site)
  - type: web
    name: weather-viz-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: weather-viz-backend
          property: url
